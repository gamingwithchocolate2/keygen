<!DOCTYPE html>
<html>
<head>
    <title>S-Suite | Key System</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #00ff00; padding: 30px; background: #000; box-shadow: 0 0 20px rgba(0,255,0,0.2); text-align: center; }
        .key { font-size: 28px; letter-spacing: 3px; margin: 20px 0; color: #fff; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ACCESS GRANTED</h2>
        <div class="key" id="k">GENERATING...</div>
        <button onclick="copyK()">COPY KEY</button>
        <p style="font-size: 12px; color: #666;">Key expires in 60 seconds. Memorize the code.</p>
    </div>
    <script>
        function getTimedKey() {
            const timeRef = Math.floor(Date.now() / 60000); 
            const secret = 539;
            const hash = ((timeRef * secret) % 9000) + 1000; 
            return `HV-${hash}`;
        }

        const activeKey = getTimedKey();
        document.getElementById('k').innerText = activeKey;

        function copyK() {
            navigator.clipboard.writeText(activeKey);
            alert("Key copied! Use it quickly, it expires in 1 minute.");
        }
    </script>
</body>
</html>
