<!DOCTYPE html>
<html>
<head>
    <title>Key System</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .key-box { border: 2px solid #0f0; padding: 20px; font-size: 24px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>YOUR ACCESS KEY</h1>
    <div class="key-box" id="keyDisplay">GENERATING...</div>
    <p>Copy this key into the key prompt.</p>

    <script>
        function generateKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let result = "HV-";
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('keyDisplay').innerText = result;
        }
        window.onload = generateKey;
    </script>
</body>
</html>
