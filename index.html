<!DOCTYPE html>
<html>
<head>
    <title>S-Suite | Key System</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #00ff00; padding: 30px; background: #000; box-shadow: 0 0 20px rgba(0,255,0,0.2); text-align: center; }
        .key { font-size: 32px; letter-spacing: 5px; margin: 20px 0; color: #fff; text-shadow: 0 0 10px #00ff00; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; font-family: monospace; }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-top:0">ACCESS GRANTED</h2>
        <div class="key" id="k">GENERATING...</div>
        <button onclick="copyK()">COPY KEY</button>
    </div>
    <script>
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // Removed confusing chars like O and 0
        let res = "HV-";
        for (let i = 0; i < 4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
        document.getElementById('k').innerText = res;

        function copyK() {
            navigator.clipboard.writeText(res);
            alert("Key copied! Paste it into the prompt on the site.");
        }
    </script>
</body>
</html>
